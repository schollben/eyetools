sessions:
  ferrets: [402, 405, 407, 420]
  eo_min: 8
  eo_max: null
  exclude:
    - session_2026-03-11_ferret_407_E11_analyzable_output   # 68% valid, tracking glitches

qc:
  max_speed_mm_s: 800
  max_abs_pitch_deg: 75
  max_ang_speed_deg_s: 1500
  pad_frames: 6

features:
  fs_out: 30          # Hz, common rate for all sessions
  min_run_s: 2        # drop valid runs shorter than this
  sg_win_s: 0.1       # Savitzky–Golay derivative window for omega_yaw
  lowpass_hz: 12      # anti-alias before resampling

seed: 0
